<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朗读播放器</title>
<style>
  :root{
    --bg:#faf8f5; --card:#ffffff; --fg:#2b2825; --dim:#8b857c;
    --line:#e8e2d9; --accent:#c2410c; --hl:#ffe9c7; --hl2:#fff6e6;
    --bar:rgba(255,255,255,.92);
  }
  html[data-theme="dark"]{
    --bg:#16181c; --card:#1e2126; --fg:#d8d5cf; --dim:#8a8f98;
    --line:#2c3138; --accent:#fb923c; --hl:#4a3a1c; --hl2:#2a2620;
    --bar:rgba(30,33,38,.92);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",Georgia,"Microsoft YaHei",serif;
    line-height:1.95; transition:background .25s,color .25s;
  }
  /* ---------- 顶部控制条 ---------- */
  #bar{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
    background:var(--bar); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:9px 16px; flex-wrap:wrap;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:13px;
  }
  button,select{
    font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line);
    border-radius:7px; padding:5px 11px; cursor:pointer; transition:.15s;
  }
  button:hover,select:hover{border-color:var(--accent); color:var(--accent)}
  button.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  #play{min-width:92px; font-weight:600}
  .sp{flex:1}
  #stat{color:var(--dim); font-variant-numeric:tabular-nums}
  #prog{width:100%; height:4px; background:var(--line); border-radius:2px; cursor:pointer; position:relative; margin-top:2px}
  #prog i{position:absolute; inset:0 auto 0 0; width:0; background:var(--accent); border-radius:2px; display:block}
  .wrap{max-width:760px; margin:0 auto; padding:26px 22px 140px}
  header h1{font-size:27px; line-height:1.45; margin:6px 0 10px}
  .meta{color:var(--dim); font-size:13px; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
        display:flex; gap:14px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:26px}
  .meta a{color:var(--accent); text-decoration:none; word-break:break-all}
  p{margin:0 0 1.15em; text-align:justify}
  .s{border-radius:4px; padding:1px 0; cursor:pointer; transition:background .18s,color .18s}
  .s:hover{background:var(--hl2)}
  .s.done{color:var(--dim); opacity:.72}
  .s.now{background:var(--hl); box-shadow:0 0 0 3px var(--hl)}
  html[data-theme="dark"] .s.now{color:#ffd79a}
  #tip{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:8px 16px; font-size:12.5px; color:var(--dim);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    box-shadow:0 6px 24px rgba(0,0,0,.09); white-space:nowrap; z-index:60;
  }
  kbd{background:var(--line); border-radius:4px; padding:1px 6px; font-size:11px; color:var(--fg)}
  @media(max-width:900px){
    #bar{font-size:12px; padding:6px 10px; gap:6px}
    button,select{padding:4px 8px}
    #play{min-width:74px}
  }
  @media(max-width:640px){ .wrap{padding:18px 16px 160px} header h1{font-size:22px} #tip{display:none} }
</style>
</head>
<body>
<div id="bar">
  <a id="home" href="/" style="display:none;text-decoration:none;font-weight:600">← 工作台</a>
  <button id="play">▶ 播放</button>
  <button id="prev" title="上一句 (←)">⟨ 上句</button>
  <button id="next" title="下一句 (→)">下句 ⟩</button>
  <select id="rate" title="语速">
    <option value="0.75">0.75×</option><option value="0.9">0.9×</option>
    <option value="1" selected>1.0×</option><option value="1.25">1.25×</option>
    <option value="1.5">1.5×</option><option value="1.75">1.75×</option>
    <option value="2">2.0×</option>
  </select>
  <select id="size" title="字号">
    <option value="15">小字号</option><option value="17.5" selected>标准</option>
    <option value="20">大字号</option><option value="23">特大</option>
  </select>
  <button id="auto" class="on" title="播放时自动滚动">滚动</button>
  <button id="theme" title="深/浅色">◐</button>
  <span class="sp"></span>
  <span id="stat">–</span>
  <div id="prog"><i></i></div>
</div>

<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <article id="body"></article>
</div>

<div id="tip"><kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 跳句 · <kbd>↑</kbd><kbd>↓</kbd> 语速 · 点击任意句子从该处开始听</div>

<audio id="au" preload="metadata" src="__AUDIO_SRC__"></audio>

<script>
const DATA = __DATA_JSON__;
const au = document.getElementById('au');
const S = [];                       // 全局句子索引 {el, start, pi, si}
let cur = -1, autoScroll = true;

/* ---------- 渲染 ---------- */
document.title = DATA.title + ' · 朗读';
document.getElementById('title').textContent = DATA.title;
const m = DATA.info || {};
const meta = [];
meta.push(`<span>${DATA.words} 字</span>`);
meta.push(`<span>约 ${Math.round(DATA.duration/60)} 分钟</span>`);
meta.push(`<span>${(DATA.voice||'').replace(/Neural$/,'')}</span>`);
if (m.source_type === '网页' && m.source) meta.push(`<a href="${m.source}" target="_blank">原文↗</a>`);
else if (m.source) meta.push(`<span title="${esc(m.source)}">${esc(short(m.source))}</span>`);
if (m.author) meta.push(`<span>${esc(m.author)}</span>`);
if (m.date) meta.push(`<span>${esc(m.date)}</span>`);
meta.push(`<span>${esc(DATA.created||'')}</span>`);
document.getElementById('meta').innerHTML = meta.join('');

const art = document.getElementById('body');
DATA.paragraphs.forEach((p, pi) => {
  const el = document.createElement('p');
  p.sentences.forEach((s, si) => {
    const sp = document.createElement('span');
    sp.className = 's';
    sp.textContent = s.text;
    sp.dataset.i = S.length;
    sp.onclick = (e) => { e.stopPropagation(); seek(findIdx(sp)); };
    el.appendChild(sp);
    S.push({el: sp, start: s.start, pi, si});
  });
  el.onclick = (e) => { if (e.target === el) seek(firstIdxOf(pi)); };
  art.appendChild(el);
});
function findIdx(sp){ return +sp.dataset.i; }
function firstIdxOf(pi){ const f = S.find(x => x.pi === pi); return f ? S.indexOf(f) : 0; }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function short(p){ return p.length > 34 ? '…'+p.slice(-32) : p; }

/* ---------- 工具 ---------- */
if (location.protocol.startsWith('http')) document.getElementById('home').style.display = '';
function fmt(s){
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ':' + String(ss).padStart(2, '0');
}

/* ---------- 播放核心 ---------- */
function timeToIdx(t){
  let lo = 0, hi = S.length - 1, ans = 0;
  while (lo <= hi){ const mid = (lo+hi)>>1; if (S[mid].start <= t*1000 + 1){ ans = mid; lo = mid+1; } else hi = mid-1; }
  return ans;
}
function paint(){
  const idx = cur;
  S.forEach((s, i) => {
    s.el.classList.toggle('now', i === idx);
    s.el.classList.toggle('done', i < idx);
  });
  if (idx >= 0 && autoScroll){
    const r = S[idx].el.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 40)
      S[idx].el.scrollIntoView({behavior:'smooth', block:'center'});
  }
}
function seek(i, play=true){
  if (i < 0 || i >= S.length) return;
  cur = i; paint();
  const t = S[i].start / 1000 + 0.02;
  if (au.readyState >= 1) au.currentTime = t;
  else au.addEventListener('loadedmetadata', () => { au.currentTime = t; }, {once:true});
  if (play && au.paused) au.play().catch(() => {});
}
au.ontimeupdate = () => {
  const i = timeToIdx(au.currentTime);
  if (i !== cur){ cur = i; paint(); }
  const p = au.duration ? au.currentTime / au.duration : 0;
  document.querySelector('#prog i').style.width = (p*100).toFixed(2) + '%';
  document.getElementById('stat').textContent =
    `${fmt(au.currentTime)} / ${fmt(au.duration||DATA.duration)}  ·  句 ${cur+1}/${S.length}`;
  localStorage.setItem('ra_'+DATA.title, JSON.stringify({t:au.currentTime, r:au.playbackRate}));
};
au.onplay = () => btnPlay.textContent = '⏸ 暂停';
au.onpause = () => btnPlay.textContent = '▶ 播放';
au.onended = () => { btnPlay.textContent = '▶ 播放'; };
au.onerror = () => { document.getElementById('stat').textContent = '音频加载失败'; };

const btnPlay = document.getElementById('play');
btnPlay.onclick = () => {
  if (au.paused){
    if (cur < 0){ restore(); if (cur < 0) seek(0, false); }
    au.play();
  } else au.pause();
};
document.getElementById('prev').onclick = () => seek(Math.max(0, cur - 1));
document.getElementById('next').onclick = () => seek(Math.min(S.length - 1, cur + 1));
document.getElementById('rate').onchange = e => { au.playbackRate = +e.target.value; };
document.getElementById('size').onchange = e => { art.style.fontSize = e.target.value + 'px'; localStorage.setItem('ra_size', e.target.value); };
document.getElementById('auto').onclick = e => { autoScroll = !autoScroll; e.target.classList.toggle('on', autoScroll); };
document.getElementById('theme').onclick = () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ra_theme', h.dataset.theme);
};
document.getElementById('prog').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  const p = (e.clientX - r.left) / r.width;
  if (au.duration) { au.currentTime = p * au.duration; }
};

/* ---------- 快捷键 ---------- */
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key;
  if (k === ' '){ e.preventDefault(); btnPlay.click(); }
  else if (k === 'ArrowLeft'){ e.preventDefault(); seek(Math.max(0, cur-1)); }
  else if (k === 'ArrowRight'){ e.preventDefault(); seek(Math.min(S.length-1, cur+1)); }
  else if (k === 'ArrowUp' || k === 'ArrowDown'){
    e.preventDefault();
    const sel = document.getElementById('rate');
    let i = [...sel.options].findIndex(o => +o.value === au.playbackRate);
    i = Math.min(sel.options.length-1, Math.max(0, i + (k==='ArrowUp'?1:-1)));
    sel.value = sel.options[i].value; au.playbackRate = +sel.value;
    document.getElementById('stat').textContent = '语速 ' + sel.value + '×';
  }
});

/* ---------- 记忆 ---------- */
function restore(){
  try{
    const s = JSON.parse(localStorage.getItem('ra_'+DATA.title) || 'null');
    if (s && s.t > 1){ au.currentTime = s.t; cur = timeToIdx(s.t); paint(); }
  }catch(_){}
}
if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
const savedTheme = localStorage.getItem('ra_theme'); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
const savedSize = localStorage.getItem('ra_size') || '17.5';
art.style.fontSize = savedSize + 'px'; document.getElementById('size').value = savedSize;
const savedRate = localStorage.getItem('ra_rate');
addEventListener('beforeunload', () => localStorage.setItem('ra_rate', String(au.playbackRate)));
</script>
</body>
</html>
